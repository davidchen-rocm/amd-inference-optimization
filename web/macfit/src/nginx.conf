worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;
    gzip_vary on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache" always;
        # BEGIN MACFIT TRAINING PROXY
        location ^~ /api/training/ {
            proxy_pass http://macfit-training-bridge:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 3m;
            client_body_timeout 20s;
            proxy_connect_timeout 3s;
            proxy_read_timeout 180s;
            proxy_send_timeout 20s;
            proxy_buffering off;
            proxy_intercept_errors on;
            error_page 502 504 = @training_unavailable;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options SAMEORIGIN always;
        }
        location @training_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options SAMEORIGIN always;
            return 503 '{"error":{"code":"training_unavailable","message":"The training connection is unavailable. Please retry.","retryable":true}}';
        }
        # END MACFIT TRAINING PROXY
        location ^~ /api/ {
            proxy_pass http://macfit-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 12s;
            proxy_send_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @api_unavailable;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location @api_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"error":{"code":"service_unavailable","message":"The database service is temporarily unavailable. Please retry."}}';
        }
        location = /catalog.json { return 308 /api/catalog; }
        location = /healthz { access_log off; return 200 "ok\n"; }
        location ~* \.(js|css|svg|png|woff2|json)$ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
